[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/east-baton-rouge-parish/baton-rouge"
  to = "/baton-rouge-water-filtration/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/east-baton-rouge-parish/baton-rouge/"
  to = "/baton-rouge-water-filtration/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/orleans-parish/new-orleans"
  to = "/new-orleans-water-filtration/"
  status = 301
  force = true

[[redirects]]
  from = "/service-areas/orleans-parish/new-orleans/"
  to = "/new-orleans-water-filtration/"
  status = 301
  force = true

[[headers]]
  for = "/water-heater-repair-baton-rouge/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/tankless-water-heater-installation-baton-rouge/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gas-water-heater-replacement-baton-rouge/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/emergency-water-heater-replacement-baton-rouge/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/free-consultation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
